<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <h2>Taskify</h2>

    <div class="input-row">
      <input id="taskInput" type="text" placeholder="Tulis task...">
      <button class="btn" id="add">Tambah</button>
    </div>
  
    <ul id="taskList" class="tasks"></ul>
  
    <div class="footer">
      <span id="count">0 task</span>
      <span>Save, tap, done.</span>
    </div>
    <script src="app.js"></script>
  </div>
</body>
</html>
